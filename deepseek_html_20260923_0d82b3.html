<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>La Rose Sucrée — Menu</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
:root {
    --rose-main: #e91e63;
    --rose-dark: #ad1457;
    --rose-medium: #f06292;
    --rose-light: #f8bbd0;
    --rose-soft: #fce4ec;
    --cream: #fff5f7;
    --cream-light: #fffafb;
    --gold: #d4af7a;
    --gold-dark: #b8935a;
    --text: #4a1d2c;
    --muted: #8e5a6b;
    --card: #fffdfe;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }

body {
    margin: 0;
    min-height: 100vh;
    font-family: 'Cairo', sans-serif;
    color: var(--text);
    background:
        radial-gradient(circle at 20% 10%, rgba(240, 98, 146, 0.25), transparent 45%),
        radial-gradient(circle at 80% 90%, rgba(173, 20, 87, 0.35), transparent 50%),
        linear-gradient(135deg, #2a0a18 0%, #4a1028 50%, #2a0a18 100%);
    background-attachment: fixed;
    padding-bottom: 70px;
    position: relative;
    overflow-x: hidden;
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: 0.08;
    background-image: radial-gradient(rgba(255, 255, 255, 0.9) 1px, transparent 1px);
    background-size: 26px 26px;
}

body::after {
    content: "";
    position: fixed;
    width: 600px;
    height: 600px;
    border-radius: 50%;
    top: -250px;
    right: -250px;
    background: radial-gradient(circle, rgba(233, 30, 99, 0.25), transparent 70%);
    pointer-events: none;
    filter: blur(40px);
}

.container {
    width: min(1180px, calc(100% - 24px));
    margin: 30px auto;
    padding: 40px 32px;
    background: rgba(255, 250, 251, 0.97);
    border: 1px solid rgba(212, 175, 122, 0.35);
    border-radius: 32px;
    box-shadow:
        0 30px 80px rgba(74, 29, 44, 0.45),
        0 0 0 1px rgba(233, 30, 99, 0.05),
        inset 0 1px 0 rgba(255, 255, 255, 0.9);
    backdrop-filter: blur(10px);
    position: relative;
    z-index: 1;
}

.container::before {
    content: "";
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 120px;
    height: 3px;
    border-radius: 0 0 99px 99px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
}

header {
    text-align: center;
    padding: 8px 10px 30px;
    position: relative;
}

.logo-mark {
    width: 130px;
    height: 130px;
    margin: 0 auto 20px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #fff5f7, #fce4ec 60%, #f8bbd0);
    border: 2px solid var(--gold);
    box-shadow:
        0 15px 40px rgba(233, 30, 99, 0.28),
        0 0 0 8px rgba(255, 255, 255, 0.7),
        0 0 0 9px rgba(212, 175, 122, 0.35);
    padding: 16px;
    position: relative;
    animation: logoFloat 6s ease-in-out infinite;
}

.logo-mark svg {
    width: 100%;
    height: 100%;
    filter: drop-shadow(0 4px 10px rgba(173, 20, 87, 0.20));
}

.logo-mark::before {
    content: "";
    position: absolute;
    inset: -22px;
    border-radius: 50%;
    border: 1px dashed rgba(212, 175, 122, 0.5);
    animation: rotateSlow 40s linear infinite;
}

.logo-mark::after {
    content: "";
    position: absolute;
    top: 4px;
    left: 50%;
    transform: translateX(-50%);
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--gold);
    box-shadow: 0 0 12px rgba(212, 175, 122, 0.9);
}

@keyframes rotateSlow {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
}

@keyframes logoFloat {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-6px); }
}

.brand-name {
    margin: 0;
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 600;
    font-size: clamp(2.4rem, 6vw, 4rem);
    letter-spacing: 2px;
    background: linear-gradient(135deg, var(--rose-dark) 0%, var(--rose-medium) 50%, var(--gold-dark) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    line-height: 1.1;
}

.brand-name span {
    display: block;
    font-size: 0.95rem;
    font-style: normal;
    font-family: 'Poppins', sans-serif;
    letter-spacing: 6px;
    color: var(--gold-dark);
    -webkit-text-fill-color: var(--gold-dark);
    margin-top: 8px;
    font-weight: 500;
    text-transform: uppercase;
}

.subtitle {
    margin: 14px 0 0;
    color: var(--muted);
    font-size: 1rem;
    font-style: italic;
    letter-spacing: .5px;
}

.divider {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    margin: 22px auto 0;
    max-width: 320px;
}

.divider-line {
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
}

.divider-icon {
    width: 22px;
    height: 22px;
    color: var(--rose-main);
}

.filter-buttons {
    position: sticky;
    top: 12px;
    z-index: 20;
    display: flex;
    justify-content: center;
    gap: 14px;
    margin: 0 auto 34px;
    padding: 12px;
    background: rgba(255, 250, 251, 0.92);
    border: 1px solid rgba(212, 175, 122, 0.30);
    border-radius: 22px;
    backdrop-filter: blur(14px);
    box-shadow: 0 8px 24px rgba(233, 30, 99, 0.08);
    max-width: 560px;
}

.filter-buttons button {
    flex: 1;
    min-width: 0;
    border: 1.5px solid transparent;
    border-radius: 14px;
    padding: 14px 22px;
    background: transparent;
    color: var(--rose-dark);
    cursor: pointer;
    font-family: 'Cairo', sans-serif;
    font-size: 1rem;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: all .3s cubic-bezier(.4, 0, .2, 1);
    position: relative;
    overflow: hidden;
}

.filter-buttons button i {
    font-size: 1.05em;
}

.filter-buttons button:hover {
    background: rgba(233, 30, 99, 0.08);
}

.filter-buttons button.active {
    background: linear-gradient(135deg, var(--rose-medium), var(--rose-dark));
    color: #fff;
    border-color: var(--rose-dark);
    box-shadow: 0 10px 24px rgba(233, 30, 99, 0.35);
    transform: translateY(-1px);
}

.menu-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 26px;
    scroll-margin-top: 110px;
}

.menu-item {
    overflow: hidden;
    background: var(--card);
    border: 1px solid rgba(212, 175, 122, 0.20);
    border-radius: 24px;
    box-shadow: 0 10px 30px rgba(74, 29, 44, .10);
    transition: transform .35s cubic-bezier(.4, 0, .2, 1), box-shadow .35s ease;
    position: relative;
}

.menu-item:hover {
    transform: translateY(-8px);
    box-shadow: 0 25px 50px rgba(233, 30, 99, .22);
}

.menu-item::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 24px;
    padding: 1px;
    background: linear-gradient(135deg, transparent 30%, rgba(212, 175, 122, 0.6), transparent 70%);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    pointer-events: none;
    opacity: 0;
    transition: opacity .35s ease;
    z-index: 2;
}

.menu-item:hover::before {
    opacity: 1;
}

.menu-item-img-wrap {
    position: relative;
    overflow: hidden;
}

.menu-item img {
    display: block;
    width: 100%;
    height: 240px;
    object-fit: cover;
    transition: transform .8s ease;
}

.menu-item:hover img {
    transform: scale(1.06);
}

.menu-item-img-wrap::after {
    content: "";
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 4px;
    background: linear-gradient(90deg, var(--rose-light), var(--rose-main), var(--rose-light));
}

.menu-info {
    padding: 20px 20px 22px;
    background: linear-gradient(180deg, transparent, rgba(248, 187, 208, 0.15));
    position: relative;
}

.menu-info h3 {
    margin: 0;
    font-family: 'Cormorant Garamond', 'Cairo', serif;
    font-size: 1.35rem;
    font-weight: 700;
    color: var(--rose-dark);
    direction: ltr;
    text-align: left;
    letter-spacing: .3px;
}

.menu-info p {
    margin: 8px 0 0;
    color: var(--muted);
    font-size: .93rem;
    line-height: 1.5;
}

.menu-price {
    display: inline-block;
    margin-top: 14px;
    padding: 7px 16px;
    border-radius: 999px;
    background: linear-gradient(135deg, var(--gold), var(--gold-dark));
    color: #fff;
    font-weight: 700;
    font-family: 'Poppins', sans-serif;
    font-size: .9rem;
    direction: ltr;
    letter-spacing: .5px;
    box-shadow: 0 6px 16px rgba(184, 147, 90, .35);
    position: relative;
}

.menu-price::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 999px;
    background: linear-gradient(180deg, rgba(255,255,255,.25), transparent);
    pointer-events: none;
}

.empty {
    grid-column: 1 / -1;
    padding: 40px 15px;
    text-align: center;
    color: var(--muted);
    font-style: italic;
}

#follow-message {
    position: fixed;
    bottom: 90px;
    right: 20px;
    background: linear-gradient(135deg, var(--rose-medium), var(--rose-dark));
    color: #fff;
    padding: 15px 18px;
    border-radius: 20px;
    text-align: center;
    box-shadow: 0 15px 40px rgba(74, 29, 44, 0.45);
    border: 1px solid rgba(212, 175, 122, 0.5);
    z-index: 1000;
    max-width: 320px;
    font-family: 'Cairo', sans-serif;
    display: flex;
    align-items: center;
    gap: 12px;
    backdrop-filter: blur(10px);
    animation: slideUp 0.6s ease-out;
}

#follow-message i.fab.fa-instagram {
    color: var(--gold);
    font-size: 26px;
}

#follow-message a {
    color: var(--rose-light);
    text-decoration: none;
    font-size: 13px;
    display: flex;
    align-items: center;
    gap: 5px;
    transition: color .2s ease;
}

#follow-message a:hover {
    color: #fff;
    text-decoration: underline;
}

#follow-message #close-follow {
    background: none;
    border: none;
    color: #fff;
    font-size: 18px;
    cursor: pointer;
    padding: 0;
    width: 22px;
    height: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform .3s ease;
}

#follow-message #close-follow:hover {
    transform: scale(1.25) rotate(90deg);
}

#dev-credit {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    z-index: 999;
    padding: 12px 20px;
    text-align: center;
    background: linear-gradient(90deg, var(--rose-dark), var(--rose-medium), var(--rose-dark));
    color: #fff;
    font-family: 'Cairo', sans-serif;
    font-size: 13px;
    letter-spacing: .3px;
    border-top: 1px solid var(--gold);
    box-shadow: 0 -6px 20px rgba(74, 29, 44, 0.35);
}

#dev-credit i.fa-code {
    color: var(--rose-light);
    margin: 0 4px;
}

#dev-credit a {
    color: #fff;
    text-decoration: none;
    font-weight: 700;
    transition: color .2s ease, text-shadow .2s ease;
}

#dev-credit a:hover {
    color: var(--rose-light);
    text-shadow: 0 0 10px rgba(248, 187, 208, 0.8);
    text-decoration: underline;
}

@keyframes slideUp {
    from { opacity: 0; transform: translateY(40px); }
    to   { opacity: 1; transform: translateY(0); }
}

@media (max-width: 768px) {
    #follow-message {
        left: 14px;
        right: 14px;
        max-width: none;
        bottom: 70px;
    }
    #dev-credit {
        font-size: 11.5px;
        padding: 10px 12px;
    }
}

@media (max-width: 600px) {
    .container {
        width: calc(100% - 12px);
        margin: 8px auto;
        padding: 22px 14px 26px;
        border-radius: 24px;
    }
    header { padding-bottom: 20px; }
    .logo-mark {
        width: 105px;
        height: 105px;
        padding: 13px;
    }
    .brand-name { letter-spacing: 1px; }
    .brand-name span { letter-spacing: 4px; font-size: 0.8rem; }
    .subtitle { font-size: .88rem; }
    .filter-buttons {
        top: 6px;
        gap: 8px;
        margin-bottom: 22px;
        padding: 8px;
    }
    .filter-buttons button {
        padding: 11px 8px;
        font-size: .88rem;
    }
    .menu-grid {
        grid-template-columns: 1fr;
        gap: 18px;
        scroll-margin-top: 85px;
    }
    .menu-item img { height: 220px; }
    .menu-info h3 { font-size: 1.2rem; }
}
</style>
</head>

<body>
<div class="container">

    <header>
        <div class="logo-mark">
            <svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="petalOuter" x1="20%" y1="10%" x2="80%" y2="90%">

                    <path d="M-2,16 Q-7,16 -10,19" stroke="#8a6a3a" stroke-width="0.5" fill="none" opacity="0.5"/>
                </g>

                <circle cx="28" cy="30" r="1.5" fill="url(#goldGrad)" opacity="0.9"/>
                <circle cx="92" cy="30" r="1.5" fill="url(#goldGrad)" opacity="0.9"/>
                <circle cx="22" cy="70" r="1" fill="url(#goldGrad)" opacity="0.7"/>
                <circle cx="98" cy="70" r="1" fill="url(#goldGrad)" opacity="0.7"/>
                <circle cx="60" cy="18" r="1.2" fill="url(#goldGrad)" opacity="0.8"/>
            </svg>
        </div>

        <h1 class="brand-name">
            La Rose Sucrée
            <span>Pâtisserie · Café</span>
        </h1>
        <p class="subtitle">~ قهوة طازجة • حلويات شهية • لمسة من السكر ~</p>

        <div class="divider">

            <span class="divider-line"></span>

    </header>

    <div class="filter-buttons">
        <button class="active" data-type="coffee">
            <i class="fas fa-mug-hot"></i>

        <button data-type="dessert">
            <i class="fas fa-cake-candles"></i>
            الحلويات
        </button>
    </div>

    <div class="menu-grid" id="menu-grid"></div>

</div>

<div id="follow-message">
    <div style="font-size: 20px;">
        <i class="fab fa-instagram"></i>
    </div>
    <div style="flex: 1; text-align: right;">
        <div style="font-size: 12px; font-weight: bold; margin-bottom: 5px;">

const menuGrid = document.getElementById('menu-grid');
const filterButtons = document.querySelectorAll('.filter-buttons button');

function displayMenu(items) {
    menuGrid.innerHTML = '';
    items = items.filter(item => item.name && item.name.trim() !== '');
    if (!items.length) {
        menuGrid.innerHTML = '<div class="empty">لا توجد منتجات في هذا القسم حالياً.</div>';
        return;
    }
    items.forEach(item => {
        const div = document.createElement('div');
        div.classList.add('menu-item');
        div.innerHTML = `
            <div class="menu-item-img-wrap">
                <img src="${item.image}" alt="${item.name}" loading="lazy"
                     onerror="this.src='https://via.placeholder.com/400x240/e91e63/ffffff?text=La+Rose+Sucree'">
            </div>
            <div class="menu-info">
                <h3>${item.name}</h3>
                <p>${item.description || ''}</p>
                <div class="menu-price">${item.price}</div>
            </div>
        `;
        menuGrid.appendChild(div);
    });
}

function filterMenu(type) {
    displayMenu(menuItems.filter(item => item.category === type));
}

filterButtons.forEach(btn => {
    btn.addEventListener('click', () => {
        const type = btn.getAttribute('data-type');
        filterButtons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        filterMenu(type);
        setTimeout(() => {
            const firstItem = menuGrid.querySelector('.menu-item');
            if (firstItem) {
                const offset = window.innerWidth <= 600 ? 88 : 110;
                const position = firstItem.getBoundingClientRect().top + window.pageYOffset - offset;
                window.scrollTo({ top: position, behavior: 'smooth' });
            }
        }, 50);
    });
});

filterMenu('coffee');

const closeFollow = document.getElementById('close-follow');
if (closeFollow) {
    closeFollow.addEventListener('click', function () {
        const msg = document.getElementById('follow-message');
        msg.style.transition = 'opacity .4s, transform .4s';
        msg.style.opacity = '0';
        msg.style.transform = 'translateY(40px)';
        setTimeout(() => { msg.style.display = 'none'; }, 400);
    });
}
</script>
